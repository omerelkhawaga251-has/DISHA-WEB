<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="rooyaiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="#18181b" stroke="url(#rooyaiGrad)" stroke-width="6"/>

  <!-- Glowing Aura -->
  <circle cx="200" cy="200" r="140" fill="url(#eyeGlow)"/>

  <!-- Stylized Vision Eye / Rooyai Symbol -->
  <g filter="url(#shadow)">
    <!-- Outer Eye Path -->
    <path d="M70 200 C120 120, 280 120, 330 200 C280 280, 120 280, 70 200 Z" 
          fill="none" 
          stroke="url(#rooyaiGrad)" 
          stroke-width="14" 
          stroke-linecap="round"/>

    <!-- Iris / Pupil Inner Ring -->
    <circle cx="200" cy="200" r="48" fill="#18181b" stroke="#ffffff" stroke-width="8"/>
    
    <!-- Central Pupil Glow -->
    <circle cx="200" cy="200" r="26" fill="url(#rooyaiGrad)"/>
    <circle cx="210" cy="190" r="7" fill="#ffffff"/>

    <!-- Dynamic Play Triangle Accent inside pupil -->
    <polygon points="194,190 194,210 212,200" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Arabic Typography "رؤياي" -->
  <text x="200" y="325" 
        font-family="'Cairo', 'Segoe UI', sans-serif" 
        font-size="34" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="2">
    رؤياي
  </text>
  
  <!-- English Subtitle "ROOYAI" -->
  <text x="200" y="352" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="14" 
        font-weight="800" 
        fill="#f97316" 
        text-anchor="middle" 
        letter-spacing="4">
    ROOYAI
  </text>
</svg>
